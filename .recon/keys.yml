# 检索键契约（阶段 2 的输入）。形状只有 keyKinds —— 不要在这里塞"哪个工具产出算什么类别"，
# 那属于证据类别（六类固定的 [静态]/[抓包]/[真机]/[回放]/[推断]/[未验证]），写在 onboarding.md 里。
#
# 下面每个 patterns 都已在语料里实测命中（计数见 onboarding.md「检索键」一节），不是凭想象列的。
keyKinds:
  # 【设计决定，2026-09-30】方向必须进键：CMD 与 NOTI 是两套**独立编号空间**，
  # 同一个数字在两侧是**不同的东西**，所以这里拆成 cmd / noti 两个 kind，**故意不合并**。
  #
  # 依据（官服顺序表 opcode_cmd.txt / opcode_noti.txt，本项目自己的产物）：
  #   * CMD 608 项（0..607）、NOTI 563 项（0..562）；NOTI 的 563 个号**全部**也存在于 CMD 范围内；
  #   * 但 563 个共享号里**只有 2 个**两侧同名（0 CHECK_CONNECTION、104 RESPONSE_CREATURE），
  #     其余 **561 个同名号语义完全不同**。
  #   * 本项目内部的实证（STATUS.md §2.5/§2.6）：
  #       `NOTI 7`  交易应答窗（请求方弹窗）  vs 组队邀请应答窗 —— 同名号不同用途；
  #       `CMD 26`  交易锁定/取消/最终确认    vs `NOTI 26` UDP 主机（CParty::send_host_info）；
  #       `CMD 10`  REQUEST_PEER（交易/组队共用，按 peerType 分流） vs `NOTI 10` WALKOUT。
  #     ⇒ 若两向都归一到 `opcode:{n}`，问"26 怎么处理"会同时命中上面全部互不相干的语义，
  #       且方向在**索引阶段就被丢掉**，事后无法分离。
  #
  # 因此阶段 2 的查询语义是**分开的**：查命令用 `cmd:N`，查通知用 `noti:N`。
  # ⚠️ 代价：只能查到字面写了 "CMD 26"/"NOTI 26" 的论断。语料里写成裸 `26` 或
  #    `protocol 26` 的地方**不会**被这两个键覆盖 —— 那属于抽取层的归一化问题，不要靠合并方向来补。
  # （曾经这里是一个合并的 opcode kind，是本模式接入时的笔误，已拆开。）

  # 客户端→服务端命令号。
  - id: cmd
    patterns:
      - '\bCMD\s*(\d+)\b'
    normalize: "cmd:{1}"

  # 服务端→客户端通知号。与 cmd 同数字但不同含义，见上。
  - id: noti
    patterns:
      - '\bNOTI\s*(\d+)\b'
    normalize: "noti:{1}"

  # `protocol N`：客户端上报的协议/通道号，与 CMD/NOTI 顺序表**不是同一张表**。
  # 实测例：`protocol 161 = ENUM_CMDPACKET_ANTIBOT`（TerSafe 反外挂 60 秒心跳，STATUS.md §2.5）。
  # 因此既不并进 cmd 也不并进 noti（并进去会造出"cmd:161 = 反外挂"这种假关联）。
  - id: protocol
    patterns:
      - 'protocol\s+(\d+)'
    normalize: "proto:{1}"

  # 客户端 DNF.exe 的函数：IDA 未命名函数是 sub_XXXXXX（0x400000 基址下的 VA）。
  - id: client_function
    patterns:
      - '\bsub_([0-9A-Fa-f]{6,8})\b'
    normalize: "cfn:0x{1}"

  # 官服 df_game_r 的符号：ELF32 符号完整，所以有 Dispatcher_* / C++ 限定名 / 半角下划线函数名。
  # 取全名（不改写、不截断），因为反查符号表全靠它。
  - id: server_symbol
    patterns:
      - '\b(Dis[Pp]atcher_[A-Za-z0-9_]+)\b'
      - '\b(C[A-Z][A-Za-z0-9]*::[A-Za-z0-9_]+)\b'
    normalize: "sym:{1}"

  # 客户端虚拟地址 / 官服符号地址。只认 6-8 位十六进制，避免把 0x10 这类常量当地址。
  #
  # ⚠️ 本键命中量级远超其余，建索引时会爆：实测 10895 次命中 / 3348 个不同地址
  #    （2026-09-30 基线，351 文件 → 平均每文件 31 次；其余键多在 25–108 次之间）。
  #    它不是坏键（本项目文档本来就满是地址），但**若按"文档里出现的每一个地址"建索引，
  #    单这一个键就会产出三万多个键空间条目，查询会被地址淹没**。
  #    阶段 2 应**单独决定本键的收敛方式**，例如：只索引**被论断正文引用过的**地址
  #    （即"哪个地址支撑了哪条结论"），而不是文档里顺手提到的每一个地址。
  #    本键的定位价值在于交叉验证（同一个地址在静态证据、真机日志、烟测里出现才算证据链），
  #    不适合当检索入口用（见 onboarding.md §8）。
  - id: address
    patterns:
      - '\b(0x[0-9A-Fa-f]{6,8})\b'
    normalize: "va:0x{1}"

  # 结构体字段偏移：语料里写成 [ebx+0x70]、user+0x10C、R+0x21 等形式。
  - id: field_offset
    patterns:
      - '\+\s*(0x[0-9A-Fa-f]{1,4})\b'
    normalize: "off:{1}"

  # 客户端资源路径（装备/称号立绘、界面等）。
  - id: resource
    patterns:
      - '\b([a-z][a-z0-9_]*/[a-z][a-z0-9_]*/[a-z0-9_]+\.[a-z0-9]+)\b'
    normalize: "res:{1}"

# `ui` 键：**有意留空，延期到真正需要它的分析阶段再填**（2026-09-30 与项目所有者确认）。
#
# 为什么留空而不是先填候选名：界面/行为这一维无法从二进制或语料可靠推断，是工具不得发明的
# 词典；先塞一批没人确认过的名字，等于往索引里灌 [未验证] 噪声，之后无法区分"确认过"与"猜的"。
#
# 补进来时必须做两件事：
#   1) terms 用**用户在会话里给出的原词**，工具不得改写；并在 .recon/onboarding.md 记明
#      "这批界面名由用户于 <日期> 给出" —— 那是它唯一的来源凭据。
#   2) 条目形状固定为：
#        - id: ui
#          terms: ['<确认过的界面名>', ...]
#          normalize: "ui:{0}"
#
# 在此之前：依赖界面名的结论只能标 [推断] 或 [未验证]，不得当事实用。
