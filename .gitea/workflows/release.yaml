name: source-tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  code: read
  releases: none
  packages: none

jobs:
  test-linux:
    runs-on: dflegacy-linux-x64
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          persist-credentials: false
      - name: Run actual managed smoke and Manager suites
        run: |
          set -euo pipefail
          for legacy_name in $(compgen -e); do
            if [[ "${legacy_name,,}" == version ]]; then unset "$legacy_name"; fi
          done
          dotnet --version
          python3 --version
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --require-hashes --only-binary=:all: -r tools/release/requirements-ci.txt
          PYTHONPATH="$PWD/tools" .venv-ci/bin/python -m pytest tools/acceptance/tests tools/debug/test_drop_control.py -q
          dotnet run --project tests/DFLegacy.SmokeTests -c Release
          dotnet run --project tests/DFLegacy.Manager.Tests -c Release -- --http --server-dir "$PWD/src/DFLegacy.Server/bin/Release/net10.0"
          node --test tests/DFLegacy.Manager.Tests/manager-browser.test.cjs tests/DFLegacy.Manager.Tests/client-pay-browser.test.cjs tests/DFLegacy.Manager.Tests/gm-management-browser.test.cjs
          python3 tools/release/release.py test
