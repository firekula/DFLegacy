name: test-build-release
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Set exactly true to publish this main/tag build after every test and build gate; default only builds artifacts"
        required: false
        default: "false"

# Gitea 1.26 granular scopes; forks are additionally clamped read-only.
permissions:
  code: read
  releases: none
  packages: none

jobs:
  test-linux:
    runs-on: dflegacy-linux-x64
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, Node 20
        with:
          persist-credentials: false
      - name: Run actual managed smoke and Manager suites
        run: |
          set -euo pipefail
          for legacy_name in $(compgen -e); do
            if [[ "${legacy_name,,}" == version ]]; then unset "$legacy_name"; fi
          done
          dotnet --version
          python3 --version
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install --require-hashes --only-binary=:all: -r tools/release/requirements-ci.txt
          PYTHONPATH="$PWD/tools" .venv-ci/bin/python -m pytest tools/acceptance/tests tools/debug/test_drop_control.py -q
          dotnet run --project tests/DFLegacy.SmokeTests -c Release
          dotnet run --project tests/DFLegacy.Manager.Tests -c Release -- --http --server-dir "$PWD/src/DFLegacy.Server/bin/Release/net10.0"
          python3 tools/release/release.py test

  windows:
    runs-on: dflegacy-windows-x64
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Bind build identity to checked out SHA
        id: meta
        env:
          BUILD_REF: ${{ gitea.ref }}
          BUILD_COMMIT: ${{ gitea.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.12 tools/release/ci.py metadata
          if ($LASTEXITCODE -ne 0) { throw 'Build identity failed' }
      - name: Run actual managed and Python suites
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:VERSION -ErrorAction SilentlyContinue
          py -3.12 -m venv .venv-ci
          if ($LASTEXITCODE -ne 0) { throw 'Test virtual environment failed' }
          ./.venv-ci/Scripts/python.exe -m pip install --require-hashes --only-binary=:all: -r tools/release/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked test dependency installation failed' }
          $env:PYTHONPATH = Join-Path $PWD 'tools'
          ./.venv-ci/Scripts/python.exe -m pytest tools/acceptance/tests tools/debug/test_drop_control.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Existing Python tool tests failed' }
          dotnet run --project tests/DFLegacy.SmokeTests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Default smoke failed' }
          dotnet run --project tests/DFLegacy.Manager.Tests -c Release -- --http --server-dir (Join-Path $PWD 'src/DFLegacy.Server/bin/Release/net10.0')
          if ($LASTEXITCODE -ne 0) { throw 'Manager suite failed' }
          py -3.12 tools/release/release.py test
          if ($LASTEXITCODE -ne 0) { throw 'Release tool suite failed' }
      - name: Native tests, immutable Windows assets and self-contained package
        run: |
          if (-not $env:DFL_TOWN_ROUTE_CONTROLLER_PVF) { $env:DFL_TOWN_ROUTE_CONTROLLER_PVF = Join-Path $PWD 'tests/fixtures/act1-town-navigation/catalog.pvf' }
          py -3.12 tools/release/ci.py windows --version $env:DFLEGACY_RELEASE_VERSION --commit $env:DFLEGACY_RELEASE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Windows release gate failed' }
      - name: Generate native fixtures and run the complete Python gate
        run: |
          $ErrorActionPreference = 'Stop'
          ./.venv-ci/Scripts/python.exe tools/release/native_fixtures.py generate --build-dir artifacts/native/ijl15 --output artifacts/native-test-fixtures
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture generation failed' }
          $env:PYTHONPATH = Join-Path $PWD 'tools'
          $env:DFLEGACY_NATIVE_FIXTURE_ROOT = Join-Path $PWD 'artifacts/native-test-fixtures'
          $env:DFLEGACY_GAMEPLAY_PROBE_DLL = Join-Path $PWD 'artifacts/native/ijl15/Release/ijl15.dll'
          $env:DFLEGACY_NATIVE_LOOP_DLL = $env:DFLEGACY_GAMEPLAY_PROBE_DLL
          ./.venv-ci/Scripts/python.exe -B -m pytest -q --junitxml=artifacts/python-complete.xml
          if ($LASTEXITCODE -ne 0) { throw 'Complete Python tests failed' }
          [xml]$results = Get-Content -Raw artifacts/python-complete.xml
          if (($results.testsuites.testsuite | ForEach-Object { [int]$_.skipped } | Measure-Object -Sum).Sum -ne 0) { throw 'Complete Python gate must not skip tests' }
      # v3 uses Gitea's legacy artifact protocol; v4+ GitHub service is incompatible.
      # Node 20 backports selected instead of Node 16/24; runner must provide Node 20.
      - uses: https://github.com/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: windows-${{ gitea.sha }}
          path: |
            artifacts/client-assets.tar.gz
            artifacts/DFLegacy-${{ steps.meta.outputs.version }}-win-x64.zip
            artifacts/DFLegacy-client-update-v2-win-x64.zip
            artifacts/DFLegacy-client-update-v2-test-win-x64.zip
            artifacts/DFLegacy-client-tools-win-x64.zip
            artifacts/DFLegacy-client-tools-test-win-x64.zip
            artifacts/native-test-fixtures/
            artifacts/python-complete.xml
          if-no-files-found: error
          retention-days: 7

  linux-packages-and-image:
    needs: [test-linux, windows]
    runs-on: dflegacy-linux-x64
    env:
      DFLEGACY_RELEASE_VERSION: ${{ needs.windows.outputs.version }}
      DFLEGACY_RELEASE_COMMIT: ${{ needs.windows.outputs.commit }}
      SOURCE_DATE_EPOCH: ${{ needs.windows.outputs.source_date_epoch }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: https://github.com/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b # v3.1.0-node20
        with:
          name: windows-${{ gitea.sha }}
          path: transfer
      - name: Verify same-SHA Windows assets, cross-publish and run Linux package
        run: |
          set -euo pipefail
          python3 tools/release/ci.py linux --version "$DFLEGACY_RELEASE_VERSION" --commit "$DFLEGACY_RELEASE_COMMIT" --assets-archive transfer/client-assets.tar.gz
          python3 tools/release/release.py verify transfer/DFLegacy-"$DFLEGACY_RELEASE_VERSION"-win-x64.zip --version "$DFLEGACY_RELEASE_VERSION" --commit "$DFLEGACY_RELEASE_COMMIT"
      - name: Build and exercise Linux x64 container with named data volume
        run: |
          set -euo pipefail
          docker buildx version
          docker buildx build --platform linux/amd64 --build-arg DFLEGACY_RELEASE_VERSION="$DFLEGACY_RELEASE_VERSION" --build-arg DFLEGACY_RELEASE_COMMIT="$DFLEGACY_RELEASE_COMMIT" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" --provenance=false --sbom=false --load --tag "dflegacy-ci:$DFLEGACY_RELEASE_COMMIT" .
          name="dflegacy-ci-${DFLEGACY_RELEASE_COMMIT:0:12}"
          volume="$name-data"
          trap 'docker rm -f "$name" >/dev/null 2>&1 || true; docker volume rm "$volume" >/dev/null 2>&1 || true' EXIT
          docker volume create "$volume"
          docker run -d --name "$name" -p 127.0.0.1::18080 -v "$volume:/app/data" "dflegacy-ci:$DFLEGACY_RELEASE_COMMIT"
          mapping=$(docker port "$name" 18080/tcp)
          for attempt in $(seq 1 60); do
            if curl -fsS "http://$mapping/health"; then break; fi
            sleep 1
          done
          curl -fsS "http://$mapping/health"
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://$mapping/ready")" = 503
          docker exec "$name" sh -c 'test "$(id -u)" != 0; touch /app/data/ci-persistence-check'
          docker stop --time 40 "$name"
          docker rm "$name"
          docker run -d --name "$name" -v "$volume:/app/data" "dflegacy-ci:$DFLEGACY_RELEASE_COMMIT"
          docker exec "$name" test -f /app/data/ci-persistence-check
          docker stop --time 40 "$name"
      - name: Exercise setup, game lifecycle, client export and persistence
        run: |
          set -euo pipefail
          python3 tests/DFLegacy.Manager.Tests/docker_smoke.py --image "dflegacy-ci:$DFLEGACY_RELEASE_COMMIT"
      - name: Build both architectures to OCI without publishing
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg DFLEGACY_RELEASE_VERSION="$DFLEGACY_RELEASE_VERSION" --build-arg DFLEGACY_RELEASE_COMMIT="$DFLEGACY_RELEASE_COMMIT" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" --provenance=false --sbom=false \
            --output type=oci,dest=artifacts/dflegacy-image.oci.tar,rewrite-timestamp=true \
            --metadata-file artifacts/oci-metadata.json .
          python3 tools/release/ci.py image-metadata --path artifacts/oci-metadata.json --version "$DFLEGACY_RELEASE_VERSION" --commit "$DFLEGACY_RELEASE_COMMIT" --epoch "$SOURCE_DATE_EPOCH"
          (cd artifacts && sha256sum dflegacy-image.oci.tar > dflegacy-image.oci.tar.sha256)
      - uses: https://github.com/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: linux-${{ gitea.sha }}
          path: |
            artifacts/DFLegacy-*.tar.gz
            artifacts/dflegacy-image.oci.tar
            artifacts/dflegacy-image.oci.tar.sha256
            artifacts/oci-metadata.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [windows, test-linux, linux-packages-and-image]
    # No pull_request_target, no secrets or write token in PR build jobs.
    if: (gitea.event_name == 'push' || (gitea.event_name == 'workflow_dispatch' && inputs.publish == 'true')) && (gitea.ref == 'refs/heads/main' || startsWith(gitea.ref, 'refs/tags/v'))
    runs-on: dflegacy-linux-x64
    permissions:
      code: read
      releases: write
      packages: write
    env:
      DFLEGACY_RELEASE_VERSION: ${{ needs.windows.outputs.version }}
      DFLEGACY_RELEASE_COMMIT: ${{ needs.windows.outputs.commit }}
      REGISTRY_IMAGE: ${{ vars.DFLEGACY_REGISTRY_IMAGE }}
      REGISTRY_HOST: ${{ vars.DFLEGACY_REGISTRY_HOST }}
      REGISTRY_USER: ${{ vars.DFLEGACY_REGISTRY_USER }}
      GITEA_URL: ${{ gitea.server_url }}
      GITEA_REPOSITORY: ${{ gitea.repository }}
      ALLOW_HTTP: ${{ vars.DFLEGACY_ALLOW_HTTP_API }}
      ALLOW_HTTP_REGISTRY: ${{ vars.DFLEGACY_ALLOW_HTTP_REGISTRY }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: https://github.com/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: windows-${{ gitea.sha }}
          path: incoming/windows
      - uses: https://github.com/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: linux-${{ gitea.sha }}
          path: incoming/linux
      - name: Verify all artifacts and atomically reserve their release identity
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_IMAGE" && test -n "$REGISTRY_HOST" && test -n "$REGISTRY_USER"
          for package in incoming/windows/DFLegacy-"$DFLEGACY_RELEASE_VERSION"-win-x64.zip incoming/linux/DFLegacy-*.tar.gz; do
            python3 tools/release/release.py verify "$package" --version "$DFLEGACY_RELEASE_VERSION" --commit "$DFLEGACY_RELEASE_COMMIT"
          done
          (cd incoming/linux && sha256sum -c dflegacy-image.oci.tar.sha256 --ignore-missing)
          extra=()
          if test "$ALLOW_HTTP" = true; then extra+=(--allow-http); fi
          args=()
          for package in incoming/windows/DFLegacy-"$DFLEGACY_RELEASE_VERSION"-win-x64.zip incoming/linux/DFLegacy-*.tar.gz; do args+=(--archive "$package"); done
          digest=$(python3 -c 'import json; print(json.load(open("incoming/linux/oci-metadata.json"))["containerimage.digest"])')
          # CreateRelease tag uniqueness chooses one full inventory/image digest.
          # An identical retry is read-only or resumes that same draft; a different
          # digest cannot reach the following Registry write.
          python3 tools/release/release.py release --reserve --gitea-url "$GITEA_URL" --repository "$GITEA_REPOSITORY" \
            --version "$DFLEGACY_RELEASE_VERSION" --commit "$DFLEGACY_RELEASE_COMMIT" --image-digest "$REGISTRY_IMAGE@$digest" "${extra[@]}" "${args[@]}"
      - name: Publish already-tested multi-architecture OCI image
        env:
          REGISTRY_TOKEN: ${{ secrets.DFLEGACY_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REGISTRY_TOKEN"
          auth=$(mktemp)
          trap 'rm -f "$auth"' EXIT
          printf '%s\n' '{"auths":{}}' > "$auth"
          tls=()
          copy_tls=()
          if test "$ALLOW_HTTP_REGISTRY" = true; then tls+=(--tls-verify=false); copy_tls+=(--dest-tls-verify=false); fi
          printf '%s' "$REGISTRY_TOKEN" | skopeo login "${tls[@]}" --authfile "$auth" --username "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"
          expected=$(python3 -c 'import json; print(json.load(open("incoming/linux/oci-metadata.json"))["containerimage.digest"])')
          # Never rebuild after gates. Content-addressed transport preserves index.
          if skopeo inspect "${tls[@]}" --authfile "$auth" --format '{{.Digest}}' "docker://$REGISTRY_IMAGE:$DFLEGACY_RELEASE_VERSION" > incoming/existing-image-digest.txt 2> incoming/registry-inspect.err; then
            test "$(cat incoming/existing-image-digest.txt)" = "$expected"
            printf '%s\n' "$expected" > incoming/image-digest.txt
          elif grep -Eqi 'manifest unknown|name unknown|status code: 404' incoming/registry-inspect.err; then
            skopeo copy "${copy_tls[@]}" --all --preserve-digests --authfile "$auth" --digestfile incoming/image-digest.txt \
              oci-archive:incoming/linux/dflegacy-image.oci.tar "docker://$REGISTRY_IMAGE:$DFLEGACY_RELEASE_VERSION"
          else
            cat incoming/registry-inspect.err >&2
            exit 1
          fi
          test "$(cat incoming/image-digest.txt)" = "$expected"
      - name: Upload to a draft and publish only the complete release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -euo pipefail
          extra=()
          if test "$ALLOW_HTTP" = true; then extra+=(--allow-http); fi
          args=()
          for package in incoming/windows/DFLegacy-"$DFLEGACY_RELEASE_VERSION"-win-x64.zip incoming/linux/DFLegacy-*.tar.gz; do args+=(--archive "$package"); done
          python3 tools/release/release.py release --gitea-url "$GITEA_URL" --repository "$GITEA_REPOSITORY" \
            --version "$DFLEGACY_RELEASE_VERSION" --commit "$DFLEGACY_RELEASE_COMMIT" --image-digest "$REGISTRY_IMAGE@$(cat incoming/image-digest.txt)" "${extra[@]}" "${args[@]}"
      - name: Advance latest only after a complete official release
        if: startsWith(gitea.ref, 'refs/tags/v')
        env:
          REGISTRY_TOKEN: ${{ secrets.DFLEGACY_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          auth=$(mktemp)
          trap 'rm -f "$auth"' EXIT
          printf '%s\n' '{"auths":{}}' > "$auth"
          tls=()
          copy_tls=()
          if test "$ALLOW_HTTP_REGISTRY" = true; then tls+=(--tls-verify=false); copy_tls+=(--src-tls-verify=false --dest-tls-verify=false); fi
          printf '%s' "$REGISTRY_TOKEN" | skopeo login "${tls[@]}" --authfile "$auth" --username "$REGISTRY_USER" --password-stdin "$REGISTRY_HOST"
          skopeo copy "${copy_tls[@]}" --all --preserve-digests --authfile "$auth" "docker://$REGISTRY_IMAGE@$(cat incoming/image-digest.txt)" "docker://$REGISTRY_IMAGE:latest"

  publish-github:
    needs: [windows, test-linux, linux-packages-and-image, publish]
    if: (gitea.event_name == 'push' || (gitea.event_name == 'workflow_dispatch' && inputs.publish == 'true')) && (gitea.ref == 'refs/heads/main' || startsWith(gitea.ref, 'refs/tags/v'))
    runs-on: dflegacy-windows-x64
    defaults:
      run:
        shell: pwsh
    env:
      DFLEGACY_RELEASE_VERSION: ${{ needs.windows.outputs.version }}
      DFLEGACY_RELEASE_COMMIT: ${{ needs.windows.outputs.commit }}
    steps:
      - uses: https://github.com/actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: https://github.com/actions/download-artifact@ad191675b41f6a5b46da9a048cb6893812da158b
        with:
          name: windows-${{ gitea.sha }}
          path: incoming/windows
      # The protected Windows runner's existing GCM store is used by default.
      # Other deployments may supply DFLEGACY_GITHUB_RELEASE_TOKEN in the host
      # process environment. Never use the Gitea GITHUB_TOKEN alias for GitHub.
      - name: Require explicit GitHub publication capability
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.12 tools/release/github_publish.py --preflight
          if ($LASTEXITCODE -ne 0) { throw 'GitHub publication capability unavailable; no release was published by this job' }
      - name: Publish verified public client update through a draft
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.12 tools/release/github_publish.py --version $env:DFLEGACY_RELEASE_VERSION --commit $env:DFLEGACY_RELEASE_COMMIT --archive incoming/windows/DFLegacy-client-update-v2-win-x64.zip --archive incoming/windows/DFLegacy-client-update-v2-test-win-x64.zip --archive incoming/windows/DFLegacy-client-tools-win-x64.zip --archive incoming/windows/DFLegacy-client-tools-test-win-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'GitHub client release was not confirmed; inspect the matching draft before retrying' }
