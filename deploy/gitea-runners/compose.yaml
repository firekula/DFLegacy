name: dflegacy-ci
services:
  docker:
    image: ${DOCKER_DIND_IMAGE:-docker:29-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977}
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=unix:///var/run/docker.sock"]
    volumes:
      - docker-data:/var/lib/docker
      - docker-socket:/var/run
      - work:/work
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///var/run/docker.sock", "info"]
      interval: 10s
      timeout: 5s
      retries: 12
  runner:
    image: dflegacy-ci-runner:5.2.4
    build:
      context: .
      args:
        DOCKER_CLI_IMAGE: ${DOCKER_CLI_IMAGE:-docker:29-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb}
    init: true
    # Jobs probe ports published on DinD's loopback, so share its network too.
    network_mode: service:docker
    restart: unless-stopped
    depends_on:
      docker:
        condition: service_healthy
    volumes:
      - ./state:/runner
      - docker-socket:/var/run
      - work:/work
      - cache:/cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:19101/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  docker-data:
  docker-socket:
  work:
  cache:
