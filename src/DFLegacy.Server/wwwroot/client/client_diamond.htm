<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta http-equiv="Content-Type" content="text/html; charset=gb2312" />
<title>D&F</title>
<link href="css/commen.css" rel="stylesheet" type="text/css" />
<script type="text/javascript" src="client-pay-settings.js"></script><script type="text/javascript" src="client-auth.js"></script><script type="text/javascript">

function configureDiamondMode() {
 if (window.DFLegacyClientPay && window.DFLegacyClientPay.testCeraEnabled === true) {
  document.getElementById("diamond_identity_label").innerHTML = "\u89d2\u8272\u540d\u79f0\uff1a";
  setDiamondMessage("\u6d4b\u8bd5\u73af\u5883\uff1a\u4e3a\u8be5\u89d2\u8272\u6240\u5c5e\u8d26\u53f7\u5f00\u901a30\u5929\u9ed1\u94bb\u3002", false);
 }
}
function jsonEscape(value) {
	return value.replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\r/g, "\\r").replace(/\n/g, "\\n");
}
function createHttpRequest() {
	if (window.XMLHttpRequest) {
		return new XMLHttpRequest();
	}
	return new ActiveXObject("Microsoft.XMLHTTP");
}
function setDiamondMessage(text, isError) {
	var message = document.getElementById("diamond_msg");
	message.innerHTML = text;
	message.style.color = isError ? "#F00" : "#DFB873";
}
function submitDiamondForm() {
	var form = document.forms["diamondForm"];
	var account = form.elements["account"].value.replace(/^\s+|\s+$/g, "");
	var days = 30;

 if (window.DFLegacyClientPay && window.DFLegacyClientPay.testCeraEnabled === true) {
  if (!account) { setDiamondMessage("\u8bf7\u8f93\u5165\u89d2\u8272\u540d\u3002", true); return false; }
  form.elements["characterName"].value = account;
  form.method = "post"; form.action = "/api/client-pay/test-diamond"; form.target = "diamondResult";
  document.getElementById("diamondResult").style.display = "block";
  setDiamondMessage("", false); form.submit(); return false;
 }
	if (!account) {
		setDiamondMessage("请输入游戏账号。", true);
		return false;
	}
	if (!window.PayAuth || typeof window.PayAuth.post != "function") {
		setDiamondMessage("\u9274\u6743\u7ec4\u4ef6\u52a0\u8f7d\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u8d26\u53f7\u670d\u52a1\u5730\u5740\u6216\u7f51\u7edc\u62e6\u622a\u540e\u5237\u65b0\u91cd\u8bd5\u3002", true);
		return false;
	}
		window.PayAuth.post("/api/client-pay/diamond", { account: account, days: days }, function (ok, status) {
			if (ok) { setDiamondMessage("\u5f00\u901a\u6210\u529f\uff0c\u8bf7\u91cd\u65b0\u767b\u5f55\u6e38\u620f\u67e5\u770b\u9ed1\u94bb\u72b6\u6001\u3002", false); }
			else if (status === 401 || status === 403) { setDiamondMessage("\u5f00\u901a\u5931\u8d25\uff1a\u9700\u8981\u7ba1\u7406\u5458\u767b\u5f55\uff08\u9ed1\u94bb\u5f00\u901a\u4ec5\u7ba1\u7406\u5458\u53ef\u7528\uff09\u3002", true); }
			else { setDiamondMessage("\u64cd\u4f5c\u5931\u8d25\uff08HTTP " + status + "\uff09\u3002", true); }
		});
		return false;
}
function resetDiamondForm() {
	document.forms["diamondForm"].reset();
	document.getElementById("diamondResult").style.display = "none";
	document.getElementById("diamond_msg").innerHTML = "";
	return false;
}
</script>
</head>
<body onload="configureDiamondMode();" oncontextmenu="return false;" ondragstart="return false;" scroll="no">
<div id="wrapper">
<div id="navi" class="navi">
	<ul id="swapNavi">
		<li class="no"><img src="images/cz.png" alt="" /><a href="client_pay.htm">充值点券</a></li>
		<li><img src="images/hz.gif" alt="" /><a href="client_diamond.htm">开通黑钻</a></li>
	</ul>
	<ol>
		<li class="now"><a href="client_diamond.htm">网银开通</a></li>
		<li><a href="client_diamond_netbar.htm">网吧开通</a></li>
	</ol>
	<div class="qpay" role="button" tabindex="0" title="账号充值" onclick="return false;"></div>
</div>

<div id="details" class="details">
    
	<div class="boxer">
		<form accept-charset="UTF-8" name="diamondForm" id="diamond_form" method="get" action="#" onsubmit="return false;">
			<ul>
				<li>
					<h3 id="diamond_identity_label">游戏账号：</h3>
					<input type="text" name="account" maxlength="32"/>
				</li>
				<li class="radio diamondDuration">
					<h3>服务时长：</h3>
					<div class="durationOptions">
						<label class="durationOption"><input type="radio" name="days" value="30" checked="checked" />30天</label>
						<label class="durationOption disabled"><input type="radio" name="days" value="15" disabled="disabled" />15天</label>
						<label class="durationOption disabled"><input type="radio" name="days" value="7" disabled="disabled" />7天</label>
					</div>
				</li>
				<li class="button">
					<a href="#" onclick="return submitDiamondForm();">充值</a>
					<a href="#" onclick="return resetDiamondForm();">重置</a>
				</li>
			</ul>
			<iframe id="diamondResult" name="diamondResult" title="Diamond result" frameborder="0" allowtransparency="true" style="display:none;width:100%;height:36px;border:0;"></iframe><p class="notice" id="diamond_msg"><span class="noticeLink" role="button" tabindex="0" title="玩家条例" onclick="return false;">黑钻会员使用有期限，详情请参见《玩家条例》</span></p>
		<input type="hidden" name="characterName" value="" /></form>
	</div>
</div>
</div>
<script type="text/javascript" src="client-layout.js"></script>
</body>
</html>
