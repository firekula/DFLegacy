; IJL15 settings for the 2008DF client.
; The client renderer stays at 640x480. Width and Height only stretch the
; outer game window, so keep a 4:3 ratio for the original UI layout.

[Resolution]
Width=800
Height=600

[Rendering]
; Whole-frame presentation: sharp (integer nearest then bilinear), point,
; linear, or legacy. Missing/unknown keys in existing INIs keep legacy behavior.
PresentationFilter=sharp
; D3D8-compatible texture sampling used while the fixed 640x480 surface is
; displayed in the outer window. Use linear for the original look, point for
; sharper pixel edges, anisotropic for angled textures, or native to disable
; the IJL15 sampler hook. This is not the D3D9-only XBRZ shader.
ScaleFilter=point

[Network]
; Absolute HTTP(S) account service base, optionally with a path prefix.
; Empty/invalid values preserve the local http://127.0.0.1:8081 service.
; Maximum 1000 ASCII bytes; no credentials, query, fragment or percent escapes.
ClientServiceUrl=

[Features]
; 1/on/true enables the IJL15 FPS and committed-memory overlay.
EnablePerformanceOverlay=1
; 1/on/true installs the IJL15 mouse-wheel scroll hook.
EnableMouseWheel=1
; Independent debug.dll overlay. Off in ordinary builds.
EnableDebugOverlay=0

[DebugOverlay]
; Both local clients should point at the server's Debug.ClientOverlay.SnapshotDirectory.
SnapshotDirectory=debug-overlay
